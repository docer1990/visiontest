name: Android Emulator Smoke Test

# The automation server's runtime behavior (instrumentation startup, JSON-RPC
# server, UiAutomator bridge) can only be exercised on a device, so it gets a
# dedicated emulator job instead of the PR unit-test gate. Runs nightly and on
# demand; kept off the PR path because emulator boots are slow and occasionally
# flaky.
#
# This drives the REAL end-to-end chain a user (or agent) uses: the visiontest
# CLI from the fat JAR -> adam/adb -> APK install -> instrumentation -> JSON-RPC
# server on the device.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  emulator-smoke:
    name: CLI -> automation server on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build fat JAR and APKs
        run: |
          ./gradlew shadowJar \
            :automation-server:assembleDebug \
            :automation-server:assembleDebugAndroidTest \
            --no-daemon

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The action runs `script` through `sh -c` (dash on ubuntu-latest), so
          # the smoke test lives in a bash file instead of inline: dash rejects
          # `set -o pipefail`, which the `java ... | tee` pipelines rely on.
          script: bash .github/scripts/emulator-smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-smoke
          path: |
            smoke-screenshot.png
            install.log
            start.log
          if-no-files-found: ignore
