name: Run Test Suites

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

# Cancel superseded runs on PRs, but never on main: every commit on main
# should get its own completed run so history stays bisectable.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mcp-server-tests:
    name: MCP Server & CLI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run app tests (MCP server + CLI, incl. e2e), coverage gate, detekt
        run: ./gradlew :app:test :app:e2eTest :app:koverVerify :app:detekt --no-daemon

  automation-server-tests:
    name: Automation Server Tests (:automation-server)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run Automation Server tests, lint, detekt
        run: ./gradlew :automation-server:test :automation-server:lint :automation-server:detekt --no-daemon


  ios-automation-tests:
    name: iOS Automation Server Tests
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SPM dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ios-automation-server/IOSAutomationServer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('ios-automation-server/IOSAutomationServer.xcodeproj/project.pbxproj') }}
          restore-keys: spm-

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project ios-automation-server/IOSAutomationServer.xcodeproj \
            -scheme IOSAutomationServer \
            -destination 'platform=iOS Simulator,name=iPhone 17'

      - name: Run iOS tests
        run: |
          xcodebuild test-without-building \
            -project ios-automation-server/IOSAutomationServer.xcodeproj \
            -scheme IOSAutomationServer \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:IOSAutomationServerTests

      # The JSON-RPC server itself (JsonRpcServer + XCUITestBridge) only runs
      # inside a UI test, so the unit suite above never exercises it. Boot it
      # for real and verify the health endpoint and a couple of JSON-RPC
      # round-trips before calling the build good.
      - name: Smoke test the automation server (health + JSON-RPC)
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project ios-automation-server/IOSAutomationServer.xcodeproj \
            -scheme IOSAutomationServer \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:IOSAutomationServerUITests/AutomationServerUITest/testRunAutomationServer \
            > server-xcodebuild.log 2>&1 &
          SERVER_PID=$!

          echo "Waiting for /health on :9009..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:9009/health > /dev/null; then
              echo "Server healthy after ~$((i*2))s"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "xcodebuild exited before the server came up"
              tail -150 server-xcodebuild.log
              exit 1
            fi
            if [ "$i" = 120 ]; then
              echo "Server did not become healthy within 240s"
              tail -150 server-xcodebuild.log
              exit 1
            fi
            sleep 2
          done

          echo "device.getInfo:"
          INFO=$(curl -sf -X POST http://localhost:9009/jsonrpc \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"device.getInfo","params":{}}')
          echo "$INFO"
          echo "$INFO" | grep -q '"result"'

          echo "ui.tapByCoordinates:"
          TAP=$(curl -sf -X POST http://localhost:9009/jsonrpc \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"ui.tapByCoordinates","params":{"x":100,"y":200}}')
          echo "$TAP"
          echo "$TAP" | grep -q '"result"'

          echo "unknown method returns a JSON-RPC error (not a crash):"
          ERR=$(curl -s -X POST http://localhost:9009/jsonrpc \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":3,"method":"no.suchMethod","params":{}}')
          echo "$ERR"
          echo "$ERR" | grep -q '"error"'

          kill "$SERVER_PID" 2>/dev/null || true
